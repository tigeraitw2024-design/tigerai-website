<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { p: 0 };
  componentDidMount() {
    this._onScroll = () => {
      if (this._raf) return;
      this._raf = requestAnimationFrame(() => {
        this._raf = 0;
        const p = Math.min(1, Math.max(0, (window.scrollY || 0) / 160));
        if (p !== this.state.p) this.setState({ p });
      });
    };
    window.addEventListener('scroll', this._onScroll, { passive: true });
    this._onScroll();
  }
  componentWillUnmount() { window.removeEventListener('scroll', this._onScroll); if (this._raf) cancelAnimationFrame(this._raf); }
  renderVals() {
    const p = this.state.p || 0;
    const l = (a, b) => Math.round((a + (b - a) * p) * 100) / 100;
    return {
      barStyle: 'height:' + l(76, 56) + 'px;margin-top:' + l(0, 12) + 'px;width:min(' + l(4000, 960) + 'px,calc(100% - ' + l(0, 32) + 'px));background:rgba(250,250,248,' + l(1, 0.94) + ');border:1px solid rgba(14,14,13,' + l(0, 0.14) + ');border-bottom:1px solid rgba(14,14,13,' + l(0.08, 0.14) + ');box-shadow:0 ' + l(0, 12) + 'px ' + l(0, 28) + 'px rgba(14,14,13,' + l(0, 0.14) + ')',
      innerStyle: 'padding:0 ' + l(64, 24) + 'px',
      logoStyle: 'height:' + l(26, 21) + 'px'
    };
  }
}
</script>
